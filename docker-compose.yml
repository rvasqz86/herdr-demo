services:
  # Only exit to the internet. Allows HTTPS CONNECT to domains in proxy/allowed-domains.txt, nothing else.
  egress-proxy:
    image: ubuntu/squid:latest
    volumes:
      - ./proxy/squid.conf:/etc/squid/squid.conf:ro
      - ./proxy/allowed-domains.txt:/etc/squid/allowed-domains.txt:ro
    networks:
      - internal   # sandbox side
      - egress     # internet side
    restart: unless-stopped

  sandbox:
    build: .
    depends_on:
      - egress-proxy
    environment:
      HTTPS_PROXY: http://egress-proxy:3128
      HTTP_PROXY: http://egress-proxy:3128
      https_proxy: http://egress-proxy:3128
      http_proxy: http://egress-proxy:3128
      NO_PROXY: localhost,127.0.0.1
      NODE_USE_ENV_PROXY: "1"   # make Node's fetch honor the proxy variables
    volumes:
      - ./workspace:/work       # only host dir the agent can touch
      - agent-home:/home/agent  # login (/login) and herdr state persist here
    networks:
      - internal                # no direct route to the internet
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    pids_limit: 512
    mem_limit: 4g
    cpus: 2
    tmpfs:
      - /tmp
    stdin_open: true
    tty: true
    restart: unless-stopped

networks:
  internal:
    internal: true
  egress: {}

volumes:
  agent-home:
