services:
  # Ollama runs NATIVELY on the Mac (Metal GPU). Containers cannot use the Apple GPU.
  # This proxy is the only path from the sandbox to the host: /v1/* only.
  model-proxy:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - internal   # sandbox side
      - hostnet    # host side (reaches native Ollama)
    restart: unless-stopped

  sandbox:
    build: .
    depends_on:
      - model-proxy
    environment:
      OPENAI_BASE_URL: http://model-proxy:11434/v1
      OPENAI_API_KEY: ollama
    volumes:
      - ./workspace:/work     # only thing agent can touch
    networks:
      - internal              # no internet
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    pids_limit: 512
    mem_limit: 8g
    cpus: 4
    tmpfs:
      - /tmp
      - /home/agent/.local/state:uid=1000,gid=1000
      - /home/agent/.cache:uid=1000,gid=1000
    stdin_open: true
    tty: true
    restart: unless-stopped

networks:
  internal:
    internal: true
  hostnet: {}
