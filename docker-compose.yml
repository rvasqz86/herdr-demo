services:
  # Ollama runs NATIVELY on the Mac so it uses the Apple GPU (Metal). Containers cannot.
  # This proxy is the only path from the sandbox to the host: /v1/* only.
  model-proxy:
    image: nginx:alpine
    environment:
      # Podman: host.containers.internal (default). Docker Desktop:
      #   OLLAMA_UPSTREAM=http://host.docker.internal:11434
      OLLAMA_UPSTREAM: ${OLLAMA_UPSTREAM:-http://host.containers.internal:11434}
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    networks:
      - internal   # sandbox side
      - hostnet    # host side (reaches native Ollama)
    restart: unless-stopped

  sandbox:
    build: .
    depends_on:
      - model-proxy
    environment:
      OPENAI_BASE_URL: http://model-proxy:11434/v1
      OPENAI_API_KEY: ollama
    volumes:
      - ./workspace:/work     # only thing agent can touch
    networks:
      - internal              # no internet
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    pids_limit: 512
    mem_limit: 4g
    cpus: 2
    tmpfs:
      - /tmp
      - /home/agent/.local/state:uid=1000,gid=1000
      - /home/agent/.cache:uid=1000,gid=1000
    stdin_open: true
    tty: true
    restart: unless-stopped

networks:
  internal:
    internal: true
  hostnet: {}
