services:
  # Ollama in a container. On macOS this is CPU only (containers cannot use the Apple GPU).
  # Only ollama has internet (for model pull). The sandbox cannot reach it directly.
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    networks:
      - backend    # model-proxy reaches it here; sandbox is NOT on this network
      - egress     # internet, for model pull only
    # Linux + NVIDIA only (container toolkit or CDI): uncomment for GPU.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    restart: unless-stopped

  # Only path from sandbox to Ollama: /v1/* (see nginx.conf). Blocks /api/pull, /api/delete, /api/create.
  model-proxy:
    image: nginx:alpine
    depends_on:
      - ollama
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - internal   # sandbox side
      - backend    # ollama side
    restart: unless-stopped

  sandbox:
    build: .
    depends_on:
      - model-proxy
    environment:
      OPENAI_BASE_URL: http://model-proxy:11434/v1
      OPENAI_API_KEY: ollama
    volumes:
      - ./workspace:/work     # only thing agent can touch
    networks:
      - internal              # no internet
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    pids_limit: 512
    mem_limit: 4g
    cpus: 2
    tmpfs:
      - /tmp
      - /home/agent/.local/state:uid=1000,gid=1000
      - /home/agent/.cache:uid=1000,gid=1000
    stdin_open: true
    tty: true
    restart: unless-stopped

networks:
  internal:
    internal: true
  backend:
    internal: true
  egress: {}

volumes:
  ollama:
