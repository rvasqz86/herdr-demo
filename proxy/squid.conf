http_port 3128
visible_hostname egress-proxy

# Allowed destinations (HTTPS only, no TLS interception)
acl allowed dstdomain "/etc/squid/allowed-domains.txt"
acl SSL_ports port 443
acl CONNECT method CONNECT

http_access deny CONNECT !SSL_ports
http_access allow CONNECT allowed
http_access deny all

# Hide client details, no caching, log every decision to stdout
forwarded_for delete
via off
cache deny all
access_log stdio:/dev/stdout
